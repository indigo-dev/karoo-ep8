name: Build Karoo EP8 APK

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release-keystore.p12"
            echo "keystore_path=$RUNNER_TEMP/release-keystore.p12" >> "$GITHUB_OUTPUT"
            echo "Release signing keystore configured."
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret configured; using fallback debug signing."
          fi

      - name: Run Unit Tests & Build APK
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/karoo-ep8.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karoo-ep8-apk
          path: ${{ runner.temp }}/karoo-ep8.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/karoo-ep8.apk
          generate_release_notes: true
