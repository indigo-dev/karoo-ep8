name: Build Kteps APK

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            python3 - <<'PY'
          import base64, os, re
          raw = os.environ.get("SIGNING_KEYSTORE_BASE64", "")
          raw = re.sub(r"^SIGNING_KEYSTORE_BASE64\s*=?\s*", "", raw.strip())
          cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          rem = len(cleaned) % 4
          if rem:
              cleaned += "=" * (4 - rem)
          try:
              data = base64.b64decode(cleaned)
          except Exception as exc:
              print(f"::warning::Failed to decode SIGNING_KEYSTORE_BASE64 ({exc}); falling back to debug signing.")
              data = b""
          out_path = os.path.join(os.environ["RUNNER_TEMP"], "release-keystore.p12")
          if len(data) >= 200 and data[0] == 0x30:
              with open(out_path, "wb") as f:
                  f.write(data)
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"keystore_path={out_path}\n")
              print(f"Release signing keystore decoded ({len(data)} bytes).")
          else:
              print(f"::warning::Decoded SIGNING_KEYSTORE_BASE64 invalid ({len(data)} bytes); falling back to debug signing.")
          PY
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret configured; using fallback debug signing."
          fi

      - name: Run Unit Tests & Build APK
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/kteps.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kteps-apk
          path: ${{ runner.temp }}/kteps.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/kteps.apk
          generate_release_notes: true
